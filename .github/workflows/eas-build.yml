name: EAS Build

# Mobile releases are triggered MANUALLY only. We intentionally do NOT build on
# push to main: every production build is a paid EAS build + TestFlight submission,
# and auto-building each merge burned through too many. Cut a release on demand
# from the Actions tab → "EAS Build" → "Run workflow".
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: false
        default: 'production'
        type: choice
        options:
          - preview
          - production
      platform:
        description: 'Platform to build'
        required: false
        default: 'ios'
        type: choice
        options:
          - ios
          - android

jobs:
  build:
    name: EAS Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        # This is the runner's Node, which only installs deps and runs the EAS
        # CLI. It is NOT the Node the app is built with: that is
        # build.base.node in eas.json (20.18.0), pinned on the EAS worker and
        # deliberately left alone so the built artifact does not change.
        # 20.18.0 here stopped working once eas-version: latest reached 23.0.0,
        # whose @oclif/plugin-autocomplete requires Node >= 22. Matches ci.yml.
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Run EAS Build
        env:
          # `eas build` runs on Expo's servers, which do not see this runner's
          # env. The symbol upload uses the SENTRY_AUTH_TOKEN secret stored in
          # the EAS production environment (`eas env:list`), not this copy.
          # The Sentry release comes from the native build
          # (bundleId@version+build): see Sentry.init in app/_layout.tsx.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          # Only production builds auto-submit: iOS to TestFlight, Android to
          # the Play internal testing track as a draft (submit.production in
          # eas.json). Preview builds use internal distribution and have no
          # submit profile, so submitting them would fail. Google Play rejects
          # API uploads until one bundle has been uploaded by hand in Play
          # Console, so the first Android release goes up manually.
          SUBMIT_FLAG=""
          if [ "${{ inputs.profile }}" = "production" ]; then
            SUBMIT_FLAG="--auto-submit"
          fi
          eas build \
            --profile ${{ inputs.profile }} \
            --platform ${{ inputs.platform }} \
            $SUBMIT_FLAG \
            --non-interactive \
            --no-wait
