name: EAS Build

# Mobile releases are triggered MANUALLY only. We intentionally do NOT build on
# push to main: every production build is a paid EAS build + TestFlight submission,
# and auto-building each merge burned through too many. Cut a release on demand
# from the Actions tab → "EAS Build" → "Run workflow".
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: false
        default: 'production'
        type: choice
        options:
          - preview
          - production
      platform:
        description: 'Platform to build'
        required: false
        default: 'ios'
        type: choice
        options:
          - ios
          - android
      submit:
        description: 'Auto-submit production builds (TestFlight / Google Play)'
        required: false
        default: true
        type: boolean
      android_track:
        description: 'Google Play track for Android production submits'
        required: false
        default: 'internal'
        type: choice
        options:
          - internal
          - production

jobs:
  build:
    name: EAS Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        # This is the runner's Node, which only installs deps and runs the EAS
        # CLI. It is NOT the Node the app is built with: that is
        # build.base.node in eas.json (20.18.0), pinned on the EAS worker and
        # deliberately left alone so the built artifact does not change.
        # 20.18.0 here stopped working once eas-version: latest reached 23.0.0,
        # whose @oclif/plugin-autocomplete requires Node >= 22. Matches ci.yml.
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Run EAS Build
        env:
          # `eas build` runs on Expo's servers, which do not see this runner's
          # env. The symbol upload uses the SENTRY_AUTH_TOKEN secret stored in
          # the EAS production environment (`eas env:list`), not this copy.
          # The Sentry release comes from the native build
          # (bundleId@version+build): see Sentry.init in app/_layout.tsx.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          # Only production builds auto-submit, and only when the "submit"
          # input is left on. iOS goes to TestFlight; Android goes to the Play
          # track chosen by the "android_track" input: "internal" uses the
          # submit.production profile (internal testing, released to testers
          # at once), "production" uses submit.play-production (the public
          # production track, full rollout, sent to Google for review). Both
          # profiles live in eas.json. Preview builds use internal
          # distribution and have no submit profile, so they never submit.
          #
          # The Android upload needs the Play service account key stored in
          # EAS credentials ("Google Service Account Key for Play Store
          # Submissions", set with `eas credentials -p android`). Without it
          # the submit step fails in --non-interactive mode while the build
          # itself still succeeds. See README.md, "Releases".
          SUBMIT_FLAG=""
          if [ "${{ inputs.profile }}" = "production" ] && [ "${{ inputs.submit }}" = "true" ]; then
            SUBMIT_PROFILE="production"
            if [ "${{ inputs.platform }}" = "android" ] && [ "${{ inputs.android_track }}" = "production" ]; then
              SUBMIT_PROFILE="play-production"
            fi
            SUBMIT_FLAG="--auto-submit-with-profile $SUBMIT_PROFILE"
            echo "Submitting with profile: $SUBMIT_PROFILE"
          fi
          eas build \
            --profile ${{ inputs.profile }} \
            --platform ${{ inputs.platform }} \
            $SUBMIT_FLAG \
            --non-interactive \
            --no-wait
