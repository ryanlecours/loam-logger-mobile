query BikeHistory($bikeId: ID!, $startDate: String, $endDate: String) {
  bikeHistory(bikeId: $bikeId, startDate: $startDate, endDate: $endDate) {
    bike {
      id
      nickname
      manufacturer
      model
      year
      shareSlug
      # Drives attribution in the exported PDF, which is downstream data.
      contributingSources
      # Pro only: null for Free, so the screen shows the Pro chip instead.
      costSummary {
        ...BikeCostSummaryFields
      }
    }
    rides {
      id
      startTime
      durationSeconds
      distanceMeters
      elevationGainMeters
      elevationLossMeters
      averageHr
      rideType
      trailSystem
      location
    }
    serviceEvents {
      id
      performedAt
      notes
      hoursAtService
      kind
      costMinor
      currency
      parts {
        ...ServicePartFields
      }
      component {
        id
        type
        location
        brand
        model
      }
    }
    installs {
      id
      eventType
      occurredAt
      component {
        id
        type
        location
        brand
        model
      }
    }
    totals {
      rideCount
      totalDistanceMeters
      totalDurationSeconds
      totalElevationGainMeters
      serviceEventCount
      installEventCount
      # Plain sum of the listed services' costs, every tier.
      spendMinor
      spendCurrency
      spendOtherCurrencyCount
    }
    truncated
  }
}

fragment BikeCostSummaryFields on BikeCostSummary {
  currency
  bikeMinor
  partsMinor
  serviceMinor
  totalMinor
  rideHours
  perHourMinor
  otherCurrencyCount
  byYear {
    year
    partsMinor
    serviceMinor
  }
}
