query Ride($id: ID!) {
  ride(id: $id) {
    id
    startTime
    durationSeconds
    distanceMeters
    elevationGainMeters
    countedElevationGainMeters
    lift {
      ...RideLiftFields
    }
    averageHr
    rideType
    bikeId
    unownedBike
    location
    notes
    garminActivityId
    garminDeviceName
    stravaActivityId
    stravaDeviceName
    whoopWorkoutId
    suuntoWorkoutId
    weather {
      id
      tempC
      feelsLikeC
      precipitationMm
      windSpeedKph
      humidity
      wmoCode
      condition
    }
  }
}

fragment RideLiftFields on RideLift {
  elevationGainMeters
  countElevation
  countElevationChoice
  segments {
    startTime
    liftName
    kind
  }
}
