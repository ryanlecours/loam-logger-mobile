mutation UpdateBikeAcquisition(
  $bikeId: ID!
  $input: UpdateBikeAcquisitionInput!
) {
  updateBikeAcquisition(bikeId: $bikeId, input: $input) {
    bike {
      id
      acquisitionDate
    }
    installsMoved
    serviceLogsMoved
  }
}

mutation BulkUpdateBikeComponentInstalls(
  $input: BulkUpdateBikeComponentInstallsInput!
) {
  bulkUpdateBikeComponentInstalls(input: $input) {
    updatedCount
    serviceLogsMoved
  }
}

# Kept apart from BikeFields so list queries never pay for the aggregate.
# costSummary is Pro only and null for Free.
query BikeCost($id: ID!) {
  bike(id: $id) {
    id
    purchasePriceMinor
    purchaseCurrency
    costSummary {
      ...BikeCostSummaryFields
    }
  }
}
