query CalibrationState {
  calibrationState {
    showOverlay
    overdueCount
    totalComponentCount
    bikes {
      bikeId
      bikeName
      thumbnailUrl
      components {
        componentId
        componentType
        location
        brand
        model
        status
        hoursRemaining
        ridesRemainingEstimate
        confidence
        currentHours
        serviceIntervalHours
        hoursSinceService
        ridesSinceService
        # Lifetime hours across every bike, including declared pre-Loam hours.
        lifetimeHours
        # The service and inspection clocks separately; `status` stays the
        # headline (the worse of the two) so a part shows one health state.
        serviceStatus
        inspectionStatus
        inspectionIntervalHours
        hoursSinceInspection
        inspectionHoursRemaining
        limitingClock
      }
    }
  }
}

mutation LogBulkComponentService($input: BulkServiceLogInput!) {
  logBulkComponentService(input: $input) {
    success
    updatedCount
  }
}

mutation DismissCalibration {
  dismissCalibration {
    id
  }
}

mutation CompleteCalibration {
  completeCalibration {
    id
  }
}
