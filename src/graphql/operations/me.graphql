query Me {
  me {
    id
    email
    name
    avatarUrl
    onboardingCompleted
    hasAcceptedCurrentTerms
    location
    age
    role
    mustChangePassword
    isFoundingRider
    hoursDisplayPreference
    predictionMode
    distanceUnit
    # ISO 4217 code new costs are entered in; null until the rider picks one.
    currency
    rideSyncNotificationMode
    weeklyDigestEnabled
    aiFeaturesEnabled
    analyticsOptOut
    pairedComponentMigrationSeenAt
    createdAt
    activeDataSource
    subscriptionTier
    subscriptionProvider
    needsDowngradeSelection
    tierLimits {
      maxBikes
      allowedComponentTypes
      currentBikeCount
      canAddBike
    }
    accounts {
      provider
      connectedAt
    }
  }
}
